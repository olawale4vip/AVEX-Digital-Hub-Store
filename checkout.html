{% extends "base.html" %}{% block title %}Checkout · AVEX Store{% endblock %}{% block content %}
<div class="panel"><h2>Customer checkout</h2><p class="muted">Enter your details so the store can prepare your order.</p><form method="post"><div class="formgrid"><label class="field">Full name<input name="name" required placeholder="Your full name"></label><label class="field">Phone number<input name="phone" required placeholder="e.g. 08012345678"></label><label class="field full">Delivery address<textarea name="address" rows="3" required placeholder="Enter your delivery address"></textarea></label></div><div class="total">Order total: ₦{{ "{:,.0f}".format(total) }}</div><div class="actions"><a class="btn secondary" href="{{ url_for('cart') }}">Back to cart</a><button class="btn">Place demo order</button></div></form><p class="muted">Demo checkout only: no payment is collected.</p></div>{% endblock %}
